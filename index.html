<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Find de Buddy!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="leaves">🌿</div>
<div class="leaves">🌿</div>
<div class="leaves">🌿</div>
<div class="leaves">🌿</div>

<header>
  <h1>Find de Buddy!</h1>
  <p class="subtitle">Hilf de Jotta de Buddy zfinde! D Yumi vermisst en scho.</p>
</header>

<div class="stats">
  <div class="stat">Level <span id="level-num">1</span></div>
  <div class="stat">Schritt <span id="steps">0</span></div>
  <div class="stat">&#9201; <span id="timer">0:00</span></div>
</div>

<div id="game-area">
  <div id="maze-wrap">
    <canvas id="maze"></canvas>
  </div>

  <div class="controls">
    <button class="btn btn-up" id="btn-up">⬆️</button>
    <button class="btn btn-left" id="btn-left">⬅️</button>
    <button class="btn btn-down" id="btn-down">⬇️</button>
    <button class="btn btn-right" id="btn-right">➡️</button>
  </div>
</div>

<div id="name-screen">
  <div class="win-box">
    <div class="win-emoji">🐱</div>
    <div class="win-title">Wie heissisch?</div>
    <p class="win-msg">Gib din Name i, demit mer dich uf de Bestelischte gsehnd!</p>
    <input type="text" id="name-input" class="name-input" placeholder="Din Name..." maxlength="12" autocomplete="off">
    <button class="next-btn" id="name-btn">Los geht's! 🚀</button>
  </div>
</div>

<div id="win-screen">
  <div class="win-box">
    <div class="win-emoji">🎉</div>
    <div class="level-badge" id="win-level">Level gschafft!</div>
    <div class="win-title">Super!</div>
    <div class="win-msg" id="win-msg">Du hesch de buddy gfunde!</div>
    <div class="win-stars" id="win-stars"></div>
    <div class="win-stats-row">
      <span class="win-stat-item" id="win-time-display"></span>
      <span class="win-stat-item" id="win-best"></span>
    </div>
    <div class="leaderboard">
      <div class="lb-title">🏆 Top 3 – Level <span id="lb-level-num">1</span></div>
      <div id="lb-entries"><span class="lb-loading">Lade...</span></div>
    </div>
    <button class="next-btn" id="next-btn">Nächsts Level ➡️</button>
  </div>
</div>

<script>
// =====================
// MAZE ENGINE
// =====================
const canvas = document.getElementById('maze');

const IMAGE_PATH = '/static/'; // local: './static/'  |  server: '/static/'

const playerImg = new Image();
playerImg.src = IMAGE_PATH + 'player.png';

const exitImg = new Image();
exitImg.src = IMAGE_PATH + 'exit.png';

const ctx = canvas.getContext('2d');

const LEVELS = [
  { cols: 7, rows: 7 },
  { cols: 9, rows: 9 },
  { cols: 11, rows: 11 },
  { cols: 13, rows: 13 },
  { cols: 15, rows: 15 },
];

let level = 0;
let maze = [];
let playerPos = { x: 0, y: 0 };
let exitPos = { x: 0, y: 0 };
let COLS, ROWS, CELL;
let steps = 0;

// =====================
// FIREBASE LEADERBOARD
// =====================
const DB_URL = 'https://jotta-labyrinth-default-rtdb.europe-west1.firebasedatabase.app';
let playerName = localStorage.getItem('jotta_name') || '';

async function submitScore(lvl, name, steps, time) {
  try {
    await fetch(`${DB_URL}/scores/level_${lvl}.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, steps, time, ts: Date.now() })
    });
  } catch(e) {}
}

async function fetchTopScores(lvl) {
  try {
    const res = await fetch(`${DB_URL}/scores/level_${lvl}.json`);
    if (!res.ok) return [];
    const data = await res.json();
    if (!data || typeof data !== 'object') return [];
    return Object.values(data)
      .sort((a, b) => a.steps !== b.steps ? a.steps - b.steps : a.time - b.time)
      .slice(0, 3);
  } catch(e) { return []; }
}

async function showLeaderboard(lvl) {
  document.getElementById('lb-level-num').textContent = lvl + 1;
  const el = document.getElementById('lb-entries');
  el.innerHTML = '<span class="lb-loading">Lade...</span>';
  const scores = await fetchTopScores(lvl);
  if (scores.length === 0) {
    el.textContent = 'No kei Einträg';
    return;
  }
  const medals = ['🥇', '🥈', '🥉'];
  el.innerHTML = scores.map((s, i) => {
    const m = Math.floor(s.time / 60), sec = s.time % 60;
    return `<div class="lb-entry">${medals[i]} <strong>${s.name}</strong> — ${s.steps} Schritt <span class="lb-time">${m}:${sec.toString().padStart(2,'0')}</span></div>`;
  }).join('');
}

// Timer
let timerInterval = null;
let elapsedSeconds = 0;

function startTimer() {
  clearInterval(timerInterval);
  elapsedSeconds = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => { elapsedSeconds++; updateTimerDisplay(); }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

function updateTimerDisplay() {
  const m = Math.floor(elapsedSeconds / 60);
  const s = elapsedSeconds % 60;
  document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// Best score (localStorage)
function getBestSteps(lvl) {
  const v = localStorage.getItem(`jotta_best_${lvl}`);
  return v !== null ? parseInt(v) : null;
}

function saveBestSteps(lvl, s) {
  const cur = getBestSteps(lvl);
  if (cur === null || s < cur) { localStorage.setItem(`jotta_best_${lvl}`, s); return true; }
  return false;
}

function calcStars(s, cols, rows) {
  const min = cols + rows - 2;
  if (s <= Math.floor(min * 1.5)) return 3;
  if (s <= Math.floor(min * 2.5)) return 2;
  return 1;
}

// Swipe support
let touchStartX = null, touchStartY = null;

const WALL_COLOR = '#1b5e20';
const PATH_COLOR = '#f9fbe7';

const FLOWER_EMOJI = '🌸';

function calcCellSize(cols, rows) {
  const maxW = Math.min(window.innerWidth - 20, 420);
  const maxH = Math.min(window.innerHeight - 280, 420);
  const byW = Math.floor(maxW / cols);
  const byH = Math.floor(maxH / rows);
  return Math.max(24, Math.min(byW, byH));
}

function initLevel() {
  const cfg = LEVELS[Math.min(level, LEVELS.length - 1)];
  COLS = cfg.cols;
  ROWS = cfg.rows;
  CELL = calcCellSize(COLS, ROWS);

  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  maze = generateMaze(COLS, ROWS);
  playerPos = { x: 0, y: 0 };
  exitPos = { x: COLS - 1, y: ROWS - 1 };
  steps = 0;

  document.getElementById('level-num').textContent = level + 1;
  document.getElementById('steps').textContent = 0;

  startTimer();
  draw();
}

// Recursive backtracker maze generation
function generateMaze(cols, rows) {
  // Each cell: { walls: [top, right, bottom, left], visited: bool }
  const grid = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({ walls: [true, true, true, true], visited: false }))
  );

  function carve(x, y) {
    grid[y][x].visited = true;
    const dirs = shuffle([[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]]);
    for (const [dx, dy, wallA, wallB] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !grid[ny][nx].visited) {
        grid[y][x].walls[wallA] = false;
        grid[ny][nx].walls[wallB] = false;
        carve(nx, ny);
      }
    }
  }

  carve(0, 0);
  return grid;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Decorative flowers (random, on path cells, not player/exit)
let flowers = [];
function generateFlowers() {
  flowers = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if ((x === 0 && y === 0) || (x === COLS-1 && y === ROWS-1)) continue;
      if (Math.random() < 0.07) flowers.push({x, y});
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = PATH_COLOR;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grid pattern
  ctx.fillStyle = 'rgba(200,230,200,0.3)';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }

  // Exit glow
  ctx.fillStyle = 'rgba(255,143,0,0.2)';
  ctx.beginPath();
  ctx.arc(exitPos.x * CELL + CELL/2, exitPos.y * CELL + CELL/2, CELL * 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Walls
  ctx.strokeStyle = WALL_COLOR;
  ctx.lineWidth = Math.max(2, CELL * 0.18);
  ctx.lineCap = 'round';

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = maze[y][x];
      const cx = x * CELL, cy = y * CELL;

      if (cell.walls[0]) { // top
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + CELL, cy); ctx.stroke();
      }
      if (cell.walls[1]) { // right
        ctx.beginPath(); ctx.moveTo(cx + CELL, cy); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke();
      }
      if (cell.walls[2]) { // bottom
        ctx.beginPath(); ctx.moveTo(cx, cy + CELL); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke();
      }
      if (cell.walls[3]) { // left
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + CELL); ctx.stroke();
      }
    }
  }

  // Border
  ctx.strokeStyle = WALL_COLOR;
  ctx.lineWidth = Math.max(3, CELL * 0.22);
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  // Flowers
  const flowerSize = CELL * 0.45;
  for (const f of flowers) {
    ctx.font = `${flowerSize}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(FLOWER_EMOJI, f.x * CELL + CELL/2, f.y * CELL + CELL/2);
  }

  // Exit (PNG image)
  const pSize = CELL * 0.9;
  const exitX = exitPos.x * CELL + CELL/2;
  const exitY = exitPos.y * CELL + CELL/2;
  
  try {
    ctx.drawImage(exitImg, exitX - pSize/2, exitY - pSize/2, pSize, pSize);
  } catch (e) {
    // Fallback to emoji if image fails
    ctx.font = `${pSize}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🦁', exitX, exitY);
  }

  // Player (PNG image)
  const playerX = playerPos.x * CELL + CELL/2;
  const playerY = playerPos.y * CELL + CELL/2;
  
  try {
    ctx.drawImage(playerImg, playerX - pSize/2, playerY - pSize/2, pSize, pSize);
  } catch (e) {
    // Fallback to emoji if image fails
    ctx.font = `${pSize}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐱', playerX, playerY);
  }
}

function tryMove(dx, dy) {
  const x = playerPos.x, y = playerPos.y;
  const cell = maze[y][x];

  // wall indices: top=0, right=1, bottom=2, left=3
  let wallIdx = -1;
  if (dy === -1) wallIdx = 0;
  else if (dx === 1) wallIdx = 1;
  else if (dy === 1) wallIdx = 2;
  else if (dx === -1) wallIdx = 3;

  if (cell.walls[wallIdx]) return; // blocked

  const nx = x + dx, ny = y + dy;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;

  playerPos = { x: nx, y: ny };
  steps++;
  document.getElementById('steps').textContent = steps;
  draw();

  if (nx === exitPos.x && ny === exitPos.y) {
    setTimeout(showWin, 300);
  }
}

function showWin() {
  stopTimer();
  const ws = document.getElementById('win-screen');
  document.getElementById('win-level').textContent = `Level ${level + 1} gschafft!`;
  const msgs = ['Da isch er!', 'D Yumi wird froh si ischer zrugg!', 'Guet gmacht!', 'Du bisch di best!'];
  document.getElementById('win-msg').textContent = msgs[level % msgs.length];

  // Stars
  const stars = calcStars(steps, COLS, ROWS);
  document.getElementById('win-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

  // Time display
  const m = Math.floor(elapsedSeconds / 60);
  const s = elapsedSeconds % 60;
  document.getElementById('win-time-display').textContent = `⏱ ${m}:${s.toString().padStart(2, '0')}`;

  // Best score
  const isNew = saveBestSteps(level, steps);
  const best = getBestSteps(level);
  const bestEl = document.getElementById('win-best');
  bestEl.textContent = isNew ? `🏆 Rekord: ${steps} Schritt!` : `Bester: ${best} Schritt`;

  // Firebase leaderboard
  submitScore(level, playerName, steps, elapsedSeconds);
  showLeaderboard(level);

  ws.classList.add('show');
}

document.getElementById('name-btn').addEventListener('click', () => {
  const val = document.getElementById('name-input').value.trim();
  if (!val) return;
  playerName = val;
  localStorage.setItem('jotta_name', playerName);
  document.getElementById('name-screen').style.display = 'none';
  initLevel();
});

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('name-btn').click();
});

document.getElementById('next-btn').addEventListener('click', () => {
  document.getElementById('win-screen').classList.remove('show');
  level++;
  generateFlowers();
  initLevel();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') tryMove(0, -1);
  else if (e.key === 'ArrowDown') tryMove(0, 1);
  else if (e.key === 'ArrowLeft') tryMove(-1, 0);
  else if (e.key === 'ArrowRight') tryMove(1, 0);
});

// =====================
// DRAG PLAYER
// =====================
let isDragging = false;
let dragLastX = 0, dragLastY = 0;
let dragAccX = 0, dragAccY = 0;

function getTouchedCell(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((clientX - rect.left) * COLS / rect.width);
  const y = Math.floor((clientY - rect.top) * ROWS / rect.height);
  return { x, y };
}

function startDrag(clientX, clientY) {
  const cell = getTouchedCell(clientX, clientY);
  if (cell.x === playerPos.x && cell.y === playerPos.y) {
    isDragging = true;
    dragLastX = clientX;
    dragLastY = clientY;
    dragAccX = 0;
    dragAccY = 0;
    touchStartX = null; // prevent swipe from also firing
    canvas.classList.add('dragging');
    return true;
  }
  return false;
}

function processDrag(clientX, clientY) {
  if (!isDragging) return;
  dragAccX += clientX - dragLastX;
  dragAccY += clientY - dragLastY;
  dragLastX = clientX;
  dragLastY = clientY;

  const rect = canvas.getBoundingClientRect();
  const cellPx = rect.width / COLS;
  const threshold = cellPx * 0.5;

  while (true) {
    const ax = Math.abs(dragAccX), ay = Math.abs(dragAccY);
    if (ax < threshold && ay < threshold) break;
    if (ax >= ay && ax >= threshold) {
      tryMove(dragAccX > 0 ? 1 : -1, 0);
      dragAccX += dragAccX > 0 ? -cellPx : cellPx;
      dragAccY = 0;
    } else if (ay > ax && ay >= threshold) {
      tryMove(0, dragAccY > 0 ? 1 : -1);
      dragAccY += dragAccY > 0 ? -cellPx : cellPx;
      dragAccX = 0;
    } else {
      break;
    }
  }
}

function endDrag() {
  isDragging = false;
  canvas.classList.remove('dragging');
}

canvas.addEventListener('touchstart', e => {
  if (startDrag(e.touches[0].clientX, e.touches[0].clientY)) {
    e.stopPropagation(); // don't let document swipe capture this touch
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  processDrag(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

canvas.addEventListener('touchend', endDrag, { passive: true });

// Mouse drag (desktop)
canvas.addEventListener('mousedown', e => { startDrag(e.clientX, e.clientY); });
document.addEventListener('mousemove', e => { processDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup', endDrag);

// =====================
// SWIPE (anywhere outside canvas / buttons)
// =====================
// Touch swipe — listen on entire document so swiping anywhere works
document.addEventListener('touchstart', e => {
  // Ignore touches on buttons
  if (e.target.closest('.controls')) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (e.target.closest('.controls')) return;
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return;
  if (absDx > absDy) tryMove(dx > 0 ? 1 : -1, 0);
  else tryMove(0, dy > 0 ? 1 : -1);
  touchStartX = null;
}, { passive: true });

// Buttons
function setupBtn(id, dx, dy) {
  const btn = document.getElementById(id);
  ['touchstart', 'mousedown'].forEach(ev => {
    btn.addEventListener(ev, e => {
      e.preventDefault();
      btn.classList.add('pressed');
      tryMove(dx, dy);
    });
  });
  ['touchend', 'mouseup'].forEach(ev => {
    btn.addEventListener(ev, () => btn.classList.remove('pressed'));
  });
}

setupBtn('btn-up', 0, -1);
setupBtn('btn-down', 0, 1);
setupBtn('btn-left', -1, 0);
setupBtn('btn-right', 1, 0);

// Start - Wait for images to load (fall through on error so game always starts)
let imagesLoaded = 0;
function checkImagesLoaded() {
  imagesLoaded++;
  if (imagesLoaded === 2) {
    generateFlowers();
    if (!playerName) {
      const ns = document.getElementById('name-screen');
      ns.style.display = 'flex';
      setTimeout(() => document.getElementById('name-input').focus(), 100);
    } else {
      initLevel();
    }
  }
}

playerImg.onload = function() { checkImagesLoaded(); };
playerImg.onerror = function() { checkImagesLoaded(); };

exitImg.onload = function() { checkImagesLoaded(); };
exitImg.onerror = function() { checkImagesLoaded(); };
</script>
</body>
</html>
